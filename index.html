<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HOÀNG ĐẠI GIANG - BÀI GIẢNG PHÒNG CHỐNG MA TÚY</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #222;
      }

      .container {
        max-width: 700px;
        margin: 80px auto;
        padding: 35px;
        background: white;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-bottom: 12px;
        font-size: 28px;
      }

      h2 {
        margin-top: 0;
        color: #555;
        font-size: 20px;
        font-weight: normal;
      }

      p {
        color: #666;
        margin: 25px 0;
      }

      .buttons {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .button {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 15px;
        font-weight: bold;
        transition: 0.2s;
      }

      .powerpoint {
        background: #f97316;
        color: white;
      }

      .powerpoint:hover {
        background: #ea580c;
      }

      .pdf {
        background: #e5e7eb;
        color: #222;
      }

      .pdf:hover {
        background: #d1d5db;
      }

      .thanks {
        margin-top: 30px;
        font-size: 18px;
        color: #555;
      }

      @media (max-width: 500px) {
        .container {
          margin: 40px auto;
          padding: 25px 18px;
        }

        h1 {
          font-size: 23px;
        }

        h2 {
          font-size: 18px;
        }

        .button {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>HOÀNG ĐẠI GIANG</h1>

      <h2>BÀI GIẢNG PHÒNG CHỐNG MA TÚY</h2>

      <p>Trường THPT Bảo Lộc</p>

      <div class="buttons">
        <!-- Xem PowerPoint -->
        <a
          class="button powerpoint"
          href="https://1drv.ms/p/c/163e9c2631aab6c0/IQD9eMxvG0cORJbT8DwK6xiZARFV9cpT-PZEYye2VjIIkL0?e=7Nx9QU"
          target="_blank"
          rel="noopener noreferrer"
        >
          📊 Xem PowerPoint
        </a>

        <!-- Xem PDF -->
        <a
          class="button pdf"
          href="https://acrobat.adobe.com/id/urn:aaid:sc:AP:367c337f-55aa-4299-9922-db0da976060e"
          target="_blank"
          rel="noopener noreferrer"
        >
          📄 Xem PDF
        </a>
      </div>

      <div class="thanks">Cảm ơn!</div>
    </div>
  </body>
</html>
